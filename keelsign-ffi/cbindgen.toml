# cbindgen 0.29.4 configuration for include/keelsign.h (SHA-60). Regenerate from the
# repository root with
#   cbindgen --config keelsign-ffi/cbindgen.toml --crate keelsign-ffi --output keelsign-ffi/include/keelsign.h keelsign-ffi
# and check with the same command plus `--verify` (CI: "keelsign.h drift (cbindgen 0.29.4)").
# Never edit the header by hand.
language = "C"
cpp_compat = true
include_guard = "KEELSIGN_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "both"
header = """/*
 * keelsign C ABI (libkeelsign.a). SPDX-License-Identifier: MIT OR Apache-2.0
 *
 * Generated by cbindgen 0.29.4 from keelsign-ffi/src with keelsign-ffi/cbindgen.toml.
 * DO NOT EDIT: regenerate with
 *   cbindgen --config keelsign-ffi/cbindgen.toml --crate keelsign-ffi --output keelsign-ffi/include/keelsign.h keelsign-ffi
 *
 * Build the library from the repository root:
 *   cargo build -p keelsign-ffi --profile ffi --locked [--target <triple>] [--features ed25519,ml-dsa]
 * which writes target[/<triple>]/ffi/libkeelsign.a. Always use --profile ffi: a host
 * --release or dev build of keelsign-ffi links std and unwinds on panic, so it is not
 * the shipped library. Pointer and length contract: see each function below and
 * docs/ffi.md.
 */"""

[export]
include = [
    "keelsign_status_t",
    "keelsign_alg_t",
    "keelsign_policy_t",
    "keelsign_key_t",
    "keelsign_result_t",
]

[parse]
parse_deps = false

[enum]
rename_variants = "None"
