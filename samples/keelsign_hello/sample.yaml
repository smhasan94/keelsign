sample:
  description: MCUboot verifying keelsign's post-quantum (LMS/HSS) signature
  name: keelsign hello
tests:
  sample.keelsign.hello:
    sysbuild: true
    platform_allow:
      - nrf52840dk/nrf52840
    integration_platforms:
      - nrf52840dk/nrf52840
    tags: mcuboot keelsign
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "keelsign: image 0 slot 0 verified (.*)"
        - "hello from keelsign_hello(.*)"
