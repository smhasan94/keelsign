# keelsign_hello sysbuild configuration (docs/mcuboot.md).
#
# MCUboot with its own ECDSA P-256 signature (imgtool, the key file sysbuild defaults
# to: MCUboot's root-ec-p256.pem, for development only) ...
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# ... and keelsign's LMS/HSS signature on top, verified in MCUboot's image-check hook
# under the post-quantum-only policy. keelsign-dev.pem (+ .state, .journal) is made in
# this directory by `keelsign keygen --alg lms-sha256-m32-h10 --out keelsign-dev.pem`
# and never committed (.gitignore).
SB_CONFIG_KEELSIGN=y
SB_CONFIG_KEELSIGN_SIGNATURE_KEY_FILE="keelsign-dev.pem"
SB_CONFIG_KEELSIGN_POLICY_PQ_ONLY=y
