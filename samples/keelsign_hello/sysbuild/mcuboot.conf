# MCUboot image of keelsign_hello (on top of MCUboot's boot/zephyr/prj.conf).
#
# keelsign verifies on MCUboot's main thread: about 5 KB of buffers and key tables plus
# about 1.5 KB for LMS/HSS (docs/mcuboot.md#stack); 10240 is MCUboot's default.
CONFIG_MAIN_STACK_SIZE=16384
# INF so the "keelsign: image 0 slot 0 verified" line is printed; the reject line is an
# error and shows at any level.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
