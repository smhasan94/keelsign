[package]
name = "nrf52840-boot-app"
description = "embassy-boot application for the nRF52840-DK that verifies its DFU slot with keelsign-embassy before marking it for swap (SHA-55)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone project: not part of the root workspace (see the root Cargo.toml `exclude`).
[workspace]

[features]
# Build app B (logs "app B"; sign it with a higher version than app A, docs/embassy.md P3).
b = []
# Verify the DFU slot in a loop and never mark it (docs/embassy.md P4: reset during
# verification).
soak = []
# Policy::Hybrid (SHA-69, docs/embassy.md P5): Ed25519 + LMS/HSS, trusting the two hybrid
# fixture LMS/HSS keys and the Ed25519 test key. The Ed25519 half is keelsign-verify's;
# embassy-boot's own verify features stay off.
hybrid = ["keelsign-embassy/ed25519"]

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "=0.11.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-time = { version = "=0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-boot = { version = "=0.7.0", default-features = false, features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-embedded-hal = { version = "=0.6.0", default-features = false, features = ["defmt"] }
keelsign-embassy = { path = "../../keelsign-embassy", features = ["nrf", "defmt"] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "=0.7.7"

[lints.rust]
unsafe_code = "forbid"

# No panic paths in no_std code (CLAUDE.md).
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
debug = 2
