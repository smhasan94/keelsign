[package]
name = "nrf52840-hello"
description = "Embassy hello-world for the nRF52840-DK: logs over defmt/RTT and blinks LED1."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone project: not part of the root workspace (see the root Cargo.toml `exclude`).
[workspace]

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "=0.11.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-time = { version = "=0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "=0.7.7"

[lints.rust]
unsafe_code = "forbid"

# No panic paths in no_std code (CLAUDE.md).
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
debug = 2
