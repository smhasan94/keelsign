[package]
name = "rp2350-boot-app"
description = "embassy-boot application for the Raspberry Pi Pico 2 W (RP2350) that verifies its DFU slot with keelsign-embassy's async updater before marking it for swap (SHA-55)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone project: not part of the root workspace (see the root Cargo.toml `exclude`).
[workspace]

[features]
# Build app B (logs "app B"; sign it with a higher version than app A, docs/embassy.md P3).
b = []
# Verify the DFU slot in a loop and never mark it (docs/embassy.md P4: reset during
# verification).
soak = []

[dependencies]
# No platform-cortex-m / executor-thread here: embassy-rp's `executor-thread` provides
# the executor and `__pender`.
embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-rp = { version = "=0.10.0", features = ["defmt", "rp235xa", "time-driver", "critical-section-impl", "executor-thread"] }
embassy-time = { version = "=0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-boot = { version = "=0.7.0", default-features = false, features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-embedded-hal = { version = "=0.6.0", default-features = false, features = ["defmt"] }
keelsign-embassy = { path = "../../keelsign-embassy", features = ["rp", "defmt"] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
cortex-m = { version = "=0.7.9", features = ["inline-asm"] }
cortex-m-rt = "=0.7.7"

[lints.rust]
unsafe_code = "forbid"

# No panic paths in no_std code (CLAUDE.md).
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
debug = 2
