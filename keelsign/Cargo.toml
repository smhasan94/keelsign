[package]
name = "keelsign"
description = "Host CLI of the keelsign post-quantum firmware signing kit: key generation and key files (pre-release)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keelsign-verify = { path = "../keelsign-verify", version = "=0.0.1" }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
pkcs8 = { version = "=0.11.0", default-features = false, features = ["pem", "encryption", "getrandom", "std"] }
getrandom = { version = "=0.4.3", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
