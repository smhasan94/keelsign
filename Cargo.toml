[workspace]
members = ["keelsign", "keelsign-verify", "tools/repo-checks"]
# Standalone embedded projects with their own Cargo.lock and target (see docs/setup.md).
exclude = ["examples/nrf52840-hello", "examples/rp2350-hello"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smhasan94/keelsign"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
