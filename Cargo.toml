[workspace]
members = [
    "keelsign",
    "keelsign-verify",
    "keelsign-ffi",
    "tools/repo-checks",
    "benches/mldsa-kat",
    "benches/lms-kat",
    "benches/policy-kat",
    "benches/stack-paint",
]
# Standalone embedded projects with their own Cargo.lock and target (see docs/setup.md
# and docs/benchmarks.md).
exclude = ["examples/nrf52840-hello", "examples/rp2350-hello", "benches/nrf52840-mldsa", "benches/rp2350-mldsa"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smhasan94/keelsign"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# SHA-60: the C static library `libkeelsign.a` (keelsign-ffi). Build it alone:
# `cargo build -p keelsign-ffi --profile ffi --locked [--target <triple>] [--features ...]`
# (docs/ffi.md). Size-optimised, one LTO unit, abort on panic; `panic` and `lto` cannot
# be set per package, hence a workspace profile.
[profile.ffi]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
