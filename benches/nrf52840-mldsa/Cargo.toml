[package]
name = "nrf52840-mldsa"
description = "SHA-34 ML-DSA-44/65 verify KATs and benchmarks on the nRF52840-DK (embedded-test)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone project: not part of the root workspace (see the root Cargo.toml `exclude`).
[workspace]

[dependencies]
mldsa-kat = { path = "../mldsa-kat", features = ["cortex-m"] }
stack-paint = { path = "../stack-paint" }
embassy-nrf = { version = "=0.11.0", features = ["defmt", "nrf52840"] }
# Synchronous tests, no embassy executor. embedded-test's panic handler replaces
# panic-probe in the test binary.
embedded-test = { version = "=0.7.2", default-features = false, features = ["semihosting", "panic-handler", "defmt"] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "=0.7.7"

[[test]]
name = "kat"
harness = false

[[bin]]
name = "size_baseline"
test = false
bench = false

[[bin]]
name = "size_mldsa44"
test = false
bench = false

[[bin]]
name = "size_mldsa65"
test = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# No panic paths in no_std code (CLAUDE.md).
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

# Primary benchmark profile (docs/benchmarks.md).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

# Flash-footprint column: release with size optimisation.
[profile.size]
inherits = "release"
opt-level = "s"
