[package]
name = "rp2350-mldsa"
description = "SHA-34 ML-DSA-44/65 and SHA-65 LMS/HSS verify KATs and benchmarks on the Raspberry Pi Pico 2 W / RP2350 (embedded-test)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone project: not part of the root workspace (see the root Cargo.toml `exclude`).
[workspace]

[dependencies]
mldsa-kat = { path = "../mldsa-kat", features = ["cortex-m"] }
lms-kat = { path = "../lms-kat" }
stack-paint = { path = "../stack-paint" }
# SHA-42: the image reader and digest, used directly by tests/image.rs and size_digest.
keelsign-verify = { path = "../../keelsign-verify" }
embassy-rp = { version = "=0.10.0", features = ["defmt", "rp235xa", "critical-section-impl"] }
# Synchronous tests, no embassy executor. embedded-test's panic handler replaces
# panic-probe in the test binary.
embedded-test = { version = "=0.7.2", default-features = false, features = ["semihosting", "panic-handler", "defmt"] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
cortex-m = { version = "=0.7.9", features = ["inline-asm"] }
cortex-m-rt = "=0.7.7"

[[test]]
name = "kat"
harness = false

[[test]]
name = "lms"
harness = false

[[test]]
name = "image"
harness = false

[[bin]]
name = "size_baseline"
test = false
bench = false

[[bin]]
name = "size_mldsa44"
test = false
bench = false

[[bin]]
name = "size_mldsa65"
test = false
bench = false

[[bin]]
name = "size_lms_baseline"
test = false
bench = false

[[bin]]
name = "size_lms"
test = false
bench = false

[[bin]]
name = "size_digest_baseline"
test = false
bench = false

[[bin]]
name = "size_digest"
test = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# No panic paths in no_std code (CLAUDE.md).
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

# Primary benchmark profile (docs/benchmarks.md).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

# Flash-footprint column: release with size optimisation.
[profile.size]
inherits = "release"
opt-level = "s"
