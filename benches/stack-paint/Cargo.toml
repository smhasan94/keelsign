[package]
name = "stack-paint"
description = "Stack painting and high-water measurement for the SHA-34 on-target benchmarks (measurement only, not published)."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

# The only `unsafe` outside keelsign-ffi (CLAUDE.md): one `#[allow(unsafe_code)]` module,
# compiled only for Arm targets. Measurement only; never a dependency of a shipped crate.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "=0.7.9", features = ["inline-asm"] }

# Not `[lints] workspace = true`: the workspace forbids unsafe_code, and `forbid` cannot be
# relaxed by the one allowed module below.
[lints.rust]
unsafe_code = "deny"

# No panic paths in no_std code (CLAUDE.md), and every unsafe block needs a SAFETY comment.
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
