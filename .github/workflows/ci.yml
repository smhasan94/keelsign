name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # SHA-47: licences, advisories (RustSec), bans and sources of the root workspace with
      # all features of every member enabled (deny.toml `[graph] all-features`). A new
      # RustSec advisory fails this step until it is fixed or ignored with a reason.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny (cargo-deny 0.20.2)
        run: cargo deny --locked check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy (keelsign-verify/ml-dsa)
        run: cargo clippy --workspace --all-targets --locked --features keelsign-verify/ml-dsa -- -D warnings

      - name: cargo clippy (keelsign-verify/ed25519)
        run: cargo clippy --workspace --all-targets --locked --features keelsign-verify/ed25519 -- -D warnings

      - name: cargo clippy (keelsign-verify/ed25519 + ml-dsa)
        run: cargo clippy --workspace --all-targets --locked --features "keelsign-verify/ed25519 keelsign-verify/ml-dsa" -- -D warnings

      # policy-kat enables keelsign-verify/ed25519, so the workspace clippy runs above
      # always unify it on; lint keelsign-verify alone so its feature-off code is checked.
      - name: cargo clippy (keelsign-verify alone, no features)
        run: cargo clippy -p keelsign-verify --all-targets --locked -- -D warnings

      - name: cargo clippy (keelsign-verify alone, ml-dsa)
        run: cargo clippy -p keelsign-verify --all-targets --locked --features ml-dsa -- -D warnings

      # SHA-60: keelsign-ffi/include/keelsign.h is cbindgen 0.29.4 output, never edited by
      # hand; fail if the sources or cbindgen.toml changed without regenerating it.
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cbindgen@0.29.4

      - name: keelsign.h drift (cbindgen 0.29.4)
        run: cbindgen --config keelsign-ffi/cbindgen.toml --crate keelsign-ffi --output keelsign-ffi/include/keelsign.h keelsign-ffi --verify

      - name: cargo test
        run: cargo test --workspace --locked

      # SHA-60: the C99 harness linked against libkeelsign.a (default and ed25519,ml-dsa
      # builds) under AddressSanitizer + UBSan: the policy matrix, digests, tampered and
      # wrong-key images, NULL and malformed arguments (repo_checks::ffi).
      - name: C harness (libkeelsign, ASan+UBSan)
        run: cargo test -p repo-checks --locked --test ffi

      # SHA-62: keelsign's MCUboot image-check hook (mcuboot/keelsign_mcuboot_hooks.c)
      # compiled against the pinned MCUboot v2.4.0 headers (cloned by
      # scripts/fetch_mcuboot.py) and run on the image fixtures: good, tampered, wrong-key
      # and hybrid images, with and without swap using offset; and the compile check
      # against MCUboot v2.5.0-rc1 (repo_checks::mcuboot `hook_*`,
      # docs/mcuboot.md#host-hook-harness).
      - name: MCUboot hook harness (network)
        run: cargo test -p repo-checks --locked --test mcuboot -- --ignored hook_

      # keelsign-verify alone, so no workspace member's features are unified in: both
      # features off (ClassicalOnly / Hybrid fail closed with Ed25519(NotEnabled)).
      - name: cargo test (keelsign-verify, no features)
        run: cargo test -p keelsign-verify --locked

      - name: cargo test (keelsign-verify, ml-dsa)
        run: cargo test -p keelsign-verify --locked --features ml-dsa

      - name: cargo test (keelsign-verify, ed25519)
        run: cargo test -p keelsign-verify --locked --features ed25519

      - name: cargo test (keelsign-verify, ed25519 + ml-dsa)
        run: cargo test -p keelsign-verify --locked --features ed25519,ml-dsa

      # SHA-47: keelsign-verify's rustdoc builds without a warning in every feature state.
      - name: cargo doc (keelsign-verify, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p keelsign-verify --locked
          cargo doc --no-deps -p keelsign-verify --locked --features ml-dsa
          cargo doc --no-deps -p keelsign-verify --locked --features ed25519
          cargo doc --no-deps -p keelsign-verify --locked --features ed25519,ml-dsa

      # SHA-303: every workspace crate's rustdoc builds without a warning on the host
      # (stack-paint names its Arm-only items in plain code spans). keelsign-ffi is
      # documented on its own: its lib target is named `keelsign`, like the CLI's, so one
      # `cargo doc --workspace` refuses both (SHA-313, docs/ffi.md); drop the `--exclude`
      # when SHA-313 lands.
      - name: cargo doc (workspace, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked --exclude keelsign-ffi
          cargo doc --no-deps -p keelsign-ffi --locked

      # SHA-51: keelsign enables keelsign-verify/ml-dsa, so `cargo test --workspace` runs
      # policy-kat with ML-DSA on; run it alone for the ML-DSA-off cells (KSPM off-set).
      - name: cargo test (policy-kat, no features)
        run: cargo test -p policy-kat --locked

      # SHA-44: the policy-matrix runner with the ML-DSA cells live (KSPM v2 on-set).
      - name: cargo test (policy-kat, keelsign-verify/ml-dsa)
        run: cargo test -p policy-kat --locked --features keelsign-verify/ml-dsa

      # SHA-55: keelsign-embassy alone (features off; its policy-kat dev-dependency turns
      # keelsign-verify/ed25519 on for the tests).
      - name: cargo clippy (keelsign-embassy)
        run: cargo clippy -p keelsign-embassy --all-targets --locked -- -D warnings

      - name: cargo test (keelsign-embassy)
        run: cargo test -p keelsign-embassy --locked

      # SHA-51: `keelsign sign` output against MCUboot's imgtool (dumpinfo, verify). The
      # tests are ignored locally unless imgtool 2.4.0 is on PATH (keelsign/tests/imgtool.rs).
      - name: imgtool interop (keelsign sign/inspect)
        run: |
          python3 -m venv .venv-imgtool && .venv-imgtool/bin/pip install imgtool==2.4.0
          PATH="$PWD/.venv-imgtool/bin:$PATH" cargo test -p keelsign --locked --test imgtool -- --ignored

      # SHA-53: the README quickstart, run verbatim against the release binary within its
      # five-minute budget (scripts/check-quickstart.sh).
      - name: readme quickstart (shell test)
        run: |
          cargo build --release -p keelsign --locked
          scripts/check-quickstart.sh --keelsign target/release

      # Only the packaging tests: the other ignored repo-checks tests need the thumb
      # targets, probe-rs and flip-link; the cross-build job covers the example builds.
      - name: repo checks (network)
        run: cargo test -p repo-checks --locked --test packaging -- --ignored

      # SHA-49: keelsign depends on keelsign-verify (path + version), which is not on
      # crates.io; a multi-package dry-run verifies keelsign against the locally packaged
      # keelsign-verify (cargo >= 1.90).
      - name: publish dry-run keelsign-verify + keelsign
        run: cargo publish --dry-run --locked -p keelsign-verify -p keelsign

  # keelsign-verify (no_std, no heap) for both Cortex-M targets, with the `ml-dsa` and
  # `ed25519` features off and on; SHA-55: keelsign-embassy too, with the same features
  # and its board module (`embassy_features`); SHA-60: keelsign-ffi's libkeelsign.a.
  verify-cross:
    name: keelsign-verify ${{ matrix.target }} (features "${{ matrix.features }}")
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            features: ""
            embassy_features: nrf,embassy-nrf/nrf52840
          - target: thumbv7em-none-eabihf
            features: ml-dsa
            embassy_features: nrf,embassy-nrf/nrf52840
          - target: thumbv7em-none-eabihf
            features: ed25519
            embassy_features: nrf,embassy-nrf/nrf52840
          - target: thumbv7em-none-eabihf
            features: ed25519,ml-dsa
            embassy_features: nrf,embassy-nrf/nrf52840
          - target: thumbv8m.main-none-eabihf
            features: ""
            embassy_features: rp,embassy-rp/rp235xa
          - target: thumbv8m.main-none-eabihf
            features: ml-dsa
            embassy_features: rp,embassy-rp/rp235xa
          - target: thumbv8m.main-none-eabihf
            features: ed25519
            embassy_features: rp,embassy-rp/rp235xa
          - target: thumbv8m.main-none-eabihf
            features: ed25519,ml-dsa
            embassy_features: rp,embassy-rp/rp235xa
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-features-${{ matrix.features || 'none' }}

      - name: cargo clippy
        run: cargo clippy -p keelsign-verify --lib --locked --target ${{ matrix.target }} --features "${{ matrix.features }}" -- -D warnings

      - name: cargo build
        run: cargo build -p keelsign-verify --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: cargo clippy (keelsign-embassy)
        run: cargo clippy -p keelsign-embassy --lib --locked --target ${{ matrix.target }} --features "${{ matrix.features }}" --features "${{ matrix.embassy_features }}" -- -D warnings

      - name: cargo build (keelsign-embassy)
        run: cargo build -p keelsign-embassy --lib --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}" --features "${{ matrix.embassy_features }}"

      # SHA-60: libkeelsign.a (keelsign-ffi) for the same target and feature state, and
      # its symbol rules: exports exactly keelsign_verify / keelsign_digest, no formatting
      # code, no panic strings, only the allowlisted trap funnels (docs/ffi.md#nm-check).
      - name: cargo clippy (keelsign-ffi)
        run: cargo clippy -p keelsign-ffi --lib --locked --target ${{ matrix.target }} --features "${{ matrix.features }}" -- -D warnings

      - name: cargo build (keelsign-ffi, profile ffi)
        run: cargo build -p keelsign-ffi --profile ffi --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: libkeelsign symbols (no fmt, no panic strings)
        run: python3 scripts/staticlib_sizes.py --check --features "${{ matrix.features }}" target/${{ matrix.target }}/ffi/libkeelsign.a

  cross-build:
    name: cross-build ${{ matrix.project }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: examples/nrf52840-hello
            target: thumbv7em-none-eabihf
            bench: false
          - project: examples/rp2350-hello
            target: thumbv8m.main-none-eabihf
            bench: false
          # SHA-55: the embassy-boot applications with keelsign-embassy (docs/embassy.md).
          # Running them needs the boards and the bootloader.
          - project: examples/nrf52840-boot-app
            target: thumbv7em-none-eabihf
            bench: false
          - project: examples/rp2350-boot-app
            target: thumbv8m.main-none-eabihf
            bench: false
          # SHA-34 (ML-DSA) and SHA-65 (LMS/HSS) on-target KATs and benchmarks: build the
          # embedded-test binaries and the flash-footprint bins (docs/benchmarks.md).
          # Running them needs the boards.
          - project: benches/nrf52840-mldsa
            target: thumbv7em-none-eabihf
            bench: true
          - project: benches/rp2350-mldsa
            target: thumbv8m.main-none-eabihf
            bench: true
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: flip-link@0.1.12

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings

      - name: cargo build
        if: ${{ !matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # SHA-55: the boot apps' app-B and soak variants (docs/embassy.md P3, P4); SHA-69:
      # and the hybrid Ed25519 + LMS/HSS build (P5).
      - name: cargo clippy (boot app, features b,soak,hybrid)
        if: ${{ contains(matrix.project, 'boot-app') }}
        run: cargo clippy --locked --target ${{ matrix.target }} --features b,soak,hybrid -- -D warnings

      - name: cargo clippy (all targets)
        if: ${{ matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: build on-target tests
        if: ${{ matrix.bench }}
        run: cargo test --no-run --release --locked --target ${{ matrix.target }}

      - name: build flash-footprint bins
        if: ${{ matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bins

      # SHA-44: the bench `ml-dsa` feature (tests/mldsa_verify.rs, the ML-DSA cells of
      # tests/policy.rs, size_verify with the ML-DSA arms), in its own target dir so the
      # feature-off builds above stay as they are.
      - name: cargo clippy (all targets, ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets --features ml-dsa --target-dir target/mldsa -- -D warnings

      - name: build on-target tests (ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo test --no-run --release --locked --target ${{ matrix.target }} --features ml-dsa --target-dir target/mldsa

      - name: build flash-footprint bins (ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bins --features ml-dsa --target-dir target/mldsa

  # SHA-62: the keelsign_hello MCUboot sample on a fresh runner, using only the scripts
  # docs/mcuboot.md tells a reader to run: scripts/zephyr-setup.sh (west 1.5.0 in a venv,
  # Zephyr v4.4.2 with MCUboot v2.4.0, Zephyr SDK 1.0.1 SHA256-checked) and
  # scripts/zephyr_sample_ci.sh all (build MCUboot + the keelsign-signed application,
  # the tampered / wrong-key variants, the hybrid compile, the refused allow-list build,
  # the stock build and the size table). The repository is checked out as `keelsign`
  # inside the workspace directory, as west.yml expects. The board runs are manual
  # (docs/mcuboot.md P1-P4).
  zephyr-sample:
    name: zephyr-sample
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: keelsign

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keelsign

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      # The SDK and the west projects, keyed on the pins (west.yml, zephyr-setup.sh).
      - uses: actions/cache@v4
        with:
          path: |
            .zephyr-sdk-1.0.1
            .west
            zephyr
            bootloader
            modules
          key: zephyr-sample-${{ runner.os }}-${{ hashFiles('keelsign/west.yml', 'keelsign/scripts/zephyr-setup.sh') }}

      - name: Zephyr workspace (scripts/zephyr-setup.sh)
        run: keelsign/scripts/zephyr-setup.sh

      - name: Sample build and checks (scripts/zephyr_sample_ci.sh all)
        run: keelsign/scripts/zephyr_sample_ci.sh all
