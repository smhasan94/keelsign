name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: repo checks (network)
        run: cargo test -p repo-checks --locked -- --ignored

      - name: publish dry-run keelsign-verify
        run: cargo publish --dry-run --locked -p keelsign-verify

      - name: publish dry-run keelsign
        run: cargo publish --dry-run --locked -p keelsign
