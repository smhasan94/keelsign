name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy (keelsign-verify/ml-dsa)
        run: cargo clippy --workspace --all-targets --locked --features keelsign-verify/ml-dsa -- -D warnings

      - name: cargo clippy (keelsign-verify/ed25519)
        run: cargo clippy --workspace --all-targets --locked --features keelsign-verify/ed25519 -- -D warnings

      - name: cargo clippy (keelsign-verify/ed25519 + ml-dsa)
        run: cargo clippy --workspace --all-targets --locked --features "keelsign-verify/ed25519 keelsign-verify/ml-dsa" -- -D warnings

      # policy-kat enables keelsign-verify/ed25519, so the workspace clippy runs above
      # always unify it on; lint keelsign-verify alone so its feature-off code is checked.
      - name: cargo clippy (keelsign-verify alone, no features)
        run: cargo clippy -p keelsign-verify --all-targets --locked -- -D warnings

      - name: cargo clippy (keelsign-verify alone, ml-dsa)
        run: cargo clippy -p keelsign-verify --all-targets --locked --features ml-dsa -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # keelsign-verify alone, so no workspace member's features are unified in: both
      # features off (ClassicalOnly / Hybrid fail closed with Ed25519(NotEnabled)).
      - name: cargo test (keelsign-verify, no features)
        run: cargo test -p keelsign-verify --locked

      - name: cargo test (keelsign-verify, ml-dsa)
        run: cargo test -p keelsign-verify --locked --features ml-dsa

      - name: cargo test (keelsign-verify, ed25519)
        run: cargo test -p keelsign-verify --locked --features ed25519

      - name: cargo test (keelsign-verify, ed25519 + ml-dsa)
        run: cargo test -p keelsign-verify --locked --features ed25519,ml-dsa

      # SHA-44: the policy-matrix runner with the ML-DSA cells live (KSPM v2 on-set).
      - name: cargo test (policy-kat, keelsign-verify/ml-dsa)
        run: cargo test -p policy-kat --locked --features keelsign-verify/ml-dsa

      # Only the packaging tests: the other ignored repo-checks tests need the thumb
      # targets, probe-rs and flip-link; the cross-build job covers the example builds.
      - name: repo checks (network)
        run: cargo test -p repo-checks --locked --test packaging -- --ignored

      - name: publish dry-run keelsign-verify
        run: cargo publish --dry-run --locked -p keelsign-verify

      - name: publish dry-run keelsign
        run: cargo publish --dry-run --locked -p keelsign

  # keelsign-verify (no_std, no heap) for both Cortex-M targets, with the `ml-dsa` and
  # `ed25519` features off and on.
  verify-cross:
    name: keelsign-verify ${{ matrix.target }} (features "${{ matrix.features }}")
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            features: ""
          - target: thumbv7em-none-eabihf
            features: ml-dsa
          - target: thumbv7em-none-eabihf
            features: ed25519
          - target: thumbv7em-none-eabihf
            features: ed25519,ml-dsa
          - target: thumbv8m.main-none-eabihf
            features: ""
          - target: thumbv8m.main-none-eabihf
            features: ml-dsa
          - target: thumbv8m.main-none-eabihf
            features: ed25519
          - target: thumbv8m.main-none-eabihf
            features: ed25519,ml-dsa
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-features-${{ matrix.features || 'none' }}

      - name: cargo clippy
        run: cargo clippy -p keelsign-verify --lib --locked --target ${{ matrix.target }} --features "${{ matrix.features }}" -- -D warnings

      - name: cargo build
        run: cargo build -p keelsign-verify --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

  cross-build:
    name: cross-build ${{ matrix.project }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: examples/nrf52840-hello
            target: thumbv7em-none-eabihf
            bench: false
          - project: examples/rp2350-hello
            target: thumbv8m.main-none-eabihf
            bench: false
          # SHA-34 (ML-DSA) and SHA-65 (LMS/HSS) on-target KATs and benchmarks: build the
          # embedded-test binaries and the flash-footprint bins (docs/benchmarks.md).
          # Running them needs the boards.
          - project: benches/nrf52840-mldsa
            target: thumbv7em-none-eabihf
            bench: true
          - project: benches/rp2350-mldsa
            target: thumbv8m.main-none-eabihf
            bench: true
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: flip-link@0.1.12

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings

      - name: cargo build
        if: ${{ !matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: cargo clippy (all targets)
        if: ${{ matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: build on-target tests
        if: ${{ matrix.bench }}
        run: cargo test --no-run --release --locked --target ${{ matrix.target }}

      - name: build flash-footprint bins
        if: ${{ matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bins

      # SHA-44: the bench `ml-dsa` feature (tests/mldsa_verify.rs, the ML-DSA cells of
      # tests/policy.rs, size_verify with the ML-DSA arms), in its own target dir so the
      # feature-off builds above stay as they are.
      - name: cargo clippy (all targets, ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets --features ml-dsa --target-dir target/mldsa -- -D warnings

      - name: build on-target tests (ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo test --no-run --release --locked --target ${{ matrix.target }} --features ml-dsa --target-dir target/mldsa

      - name: build flash-footprint bins (ml-dsa)
        if: ${{ matrix.bench }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bins --features ml-dsa --target-dir target/mldsa
