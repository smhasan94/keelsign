# cargo-deny 0.20.2 configuration for the root workspace (Cargo.lock) (SHA-47).
# CI runs `cargo deny --locked check` in the `ci` job; docs/setup.md pins the tool.
# The standalone projects under benches/ and examples/ and fuzz/ have their own
# lockfiles and are not covered here (follow-up SHA-324).

[licenses]
# Every licence in the dependency graph, by SPDX ID. keelsign itself is
# MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0110", reason = "bare-metal 0.2.5 is unmaintained (no known vulnerability). It comes only through cortex-m 0.7.9, which embassy-nrf and embassy-rp (keelsign-embassy's optional board modules), mldsa-kat and the measurement-only stack-paint crate use; cortex-m 0.7 has no maintained replacement in that graph yet. Moving off cortex-m 0.7 / bare-metal is follow-up SHA-323." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
